<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>香港社畜實錄 · 3D數位藝術 MMO 跨平台連線版 v5.2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Noto Sans TC', sans-serif; overflow: hidden; user-select: none; background-color: #050811; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-hud { background: rgba(9, 14, 28, 0.90); backdrop-filter: blur(18px); border: 1px solid rgba(255, 255, 255, 0.15); }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.92) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    .animate-pop { animation: popIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes alertPulseBorder { 0%, 100% { box-shadow: 0 0 0 0 rgba(253, 224, 71, 0.8), 0 20px 60px rgba(220, 38, 38, 0.85); } 50% { box-shadow: 0 0 0 10px rgba(253, 224, 71, 0), 0 25px 70px rgba(220, 38, 38, 0.95); } }
    .alert-glow { animation: alertPulseBorder 1.4s infinite; }
    @keyframes slapShake { 0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); } 20% { transform: translate(-12px, -4px) rotate(-10deg) scale(0.94); } 45% { transform: translate(11px, 4px) rotate(9deg) scale(0.96); } 70% { transform: translate(-8px, 3px) rotate(-6deg) scale(0.98); } }
    .animate-slap { animation: slapShake 0.22s ease-out; }
    .perspective-1000 { perspective: 1000px; }
  </style>
</head>
<body id="game-body" class="h-screen w-screen relative text-slate-100">
  <!-- 請將原本的 HTML UI (如 #creation-screen, #hud-top, #hud-bottom 等模態視窗) 完整貼上至此 -->
  <div id="webgl-viewport" class="fixed inset-0 w-full h-full cursor-grab active:cursor-grabbing"></div>
  <div id="floating-ui-layer" class="fixed inset-0 pointer-events-none overflow-hidden z-10"></div>
  
  <div id="event-banner" class="hidden fixed inset-x-0 top-1/2 -translate-y-1/2 z-[60] flex justify-center pointer-events-none">
     <div class="pointer-events-auto max-w-md w-full bg-gradient-to-br from-red-800 to-amber-700 text-white p-4 rounded-3xl border-2 border-yellow-300 alert-glow">
        <h2 id="event-banner-title" class="font-black">突發事件！</h2>
        <p id="event-banner-desc" class="text-sm">描述</p>
        <button id="event-banner-btn" class="mt-2 py-2 px-4 rounded bg-yellow-300 text-red-950 font-black" onclick="closeModal('event-banner')">行動</button>
     </div>
  </div>

  <script>
    // =========================================================================
    // 1. 全域狀態 (已整合新增機制：日期、遲到、宿醉、KPI歷史)
    // =========================================================================
    const state = {
      gender: 'male',
      hairStyle: 0,
      serverLabel: '1服 · 中環 IFC 金融中心',
      roomCode: 'IFC88',
      currentScene: 'office',
      name: 'Kelvin 陳',
      dept: 'IT 資訊科技部',
      outfitStyle: 0,
      hairColor: '#1c1917',
      outfitColor: '#f8fafc',
      accessories: { glasses: true, darkCircles: true, headphones: false, handbag: false },
      x: 0, z: 2.5, targetX: null, targetZ: null, rotY: 0,
      walkPhase: 0, isMoving: false, isSmoking: false, isLitCig: false, isPooping: false,
      isDancing: false, punishTimer: 0, drunkTimer: 0,
      speech: '09:00 返工鐘響！點擊頂部綠色人數可邀線上同事煙Break、請飲咖啡或蘭桂坊共舞！',
      speechTimer: 8.5, emote: '', emoteTimer: 0,
      caffeine: 80, hair: 85, xp: 20, level: 1, money: 500,
      dailyKpi: 0, dailyPenalty: 0, dailyPoopCount: 0,
      payslipPaidToday: false, lunchEatenToday: false,
      affection: { npc_vivienne: 25, bot_sales: 20, bot_it: 20, bot_hr: 15 },
      secrecyAlert: 0, factions: { bootlick: 30, slack: 50, gossip: 40 },
      gear: { chair: false, watch: false, homeUpgrade: false },
      hasOfferCard: false, savedCard: null,
      employmentMode: 'employed', resignedStatus: null,
      clockMinutes: 540, dismissalNotifiedToday: false,
      sleepDebuff: 'normal', sleepAlertNotified: false,
      typhoonSignal: 1, typhoonCountdown: 0, mtrFault: false, companion: null, pendingDate: null,
      
      // ===== 新增核心機制狀態 =====
      day: 1,            // 星期一至五 (1=一, 5=五)
      dayCount: 1,       // 總生存日數
      kpiHistory: [],    // 記錄每週 KPI
      pipWarnings: 0,    // 警告信數量
      hangover: false,   // 宿醉狀態
      isLate: false      // 遲到狀態
    };

    function triggerSfx(type) { console.log('SFX triggered:', type); }
    function addFeedLog(msg) { console.log('Feed:', msg); }
    function showEventBanner(icon, title, desc, btnText, action) {
        const banner = document.getElementById('event-banner');
        if(banner) {
            banner.classList.remove('hidden');
            document.getElementById('event-banner-title').textContent = icon + ' ' + title;
            document.getElementById('event-banner-desc').textContent = desc;
            document.getElementById('event-banner-btn').textContent = btnText;
        }
    }
    function closeModal(id) { 
        const el = document.getElementById(id);
        if(el) el.classList.add('hidden'); 
    }
    function showEmote(emoji, msg) { console.log('Emote:', emoji, msg); }

    // =========================================================================
    // 2. 新增與修正的核心遊戲機制 API
    // =========================================================================

    // 🐛 修復煙 Break Bug
    function stopSmoking() {
      state.isSmoking = false;
      state.isLitCig = false;
      const buff = document.getElementById('hud-smoke-buff');
      if (buff) buff.classList.add('hidden');
      if (typeof previewModel !== 'undefined' && previewModel?.userData?.cigarette) {
          previewModel.userData.cigarette.visible = false;
      }
    }

    // 擴充轉場函數，確保重置狀態
    const originalSwitchScene = window.switchScene || function(s){ console.log('Scene changed to:', s); };
    window.switchScene = function(sceneId, bypass, callback) {
      stopSmoking(); // 轉場前強制熄煙
      originalSwitchScene(sceneId, bypass, callback);
    };

    // 📅 日期推進、找卡數與 Appraisal 季結算
    window.endOfDayRoutine = function() {
      state.kpiHistory.push(state.dailyKpi || 0);
      
      if (state.day === 5) {
        const rentAndBills = 3500;
        state.money -= rentAndBills;
        if (state.money < 0) {
          showEventBanner('💸', '破產警告！', '交唔出卡數同租金，今晚要瞓麥記，聽朝精神減半！', '慘烈接受', 'bankruptcy');
          state.sleepDebuff = 'homeless';
        } else {
          addFeedLog(`💸 星期五找卡數及交租，扣除 HK$${rentAndBills}`);
        }
        
        const avgKpi = state.kpiHistory.reduce((a, b) => a + b, 0) / 5;
        if (avgKpi >= 70) {
          addFeedLog('🎉 Appraisal 達標！升職加薪！');
          state.level += 1;
          state.money += 500; // 獎金
        } else if (avgKpi < 40) {
          state.pipWarnings += 1;
          showEventBanner('🚨', 'PIP 改善計劃警告！', '你呢個禮拜成日去煙Break同偷情，KPI太低！', '死死地氣簽名', 'pip');
          if (state.pipWarnings >= 2) {
             addFeedLog('💥 你被正式解僱！進入自由身模式！');
             state.employmentMode = 'freelance';
          }
        }
        
        state.kpiHistory = [];
        state.day = 1; // 循環回星期一
      } else {
        state.day += 1;
      }
      state.dayCount += 1;
      state.dailyKpi = 0; // 重置每日 KPI
    };

    // 🤢 宿醉系統
    window.checkHangover = function() {
      if (state.hangover) {
        state.caffeine = Math.max(0, state.caffeine - 30);
        document.getElementById('game-body').classList.add('animate-slap');
        setTimeout(() => document.getElementById('game-body').classList.remove('animate-slap'), 1000);
        showEventBanner('🤢', '嚴重宿醉', '尋晚蘭桂坊飲大咗，精神消耗速度加倍，快啲去買杯 $35 Starbucks 續命！', '頂硬上', 'close');
        state.hangover = false; // 提示後解除，但精神已扣減
      }
    };

    // 🚇 迫地鐵連鎖反應 (遲到機制)
    window.commuteGameEnd = function(success) {
      if (!success) {
        state.isLate = true;
        addFeedLog('⏰ 上唔到車！你今日遲到咗 15 分鐘！');
      }
      window.switchScene('office');
      
      if (state.isLate) {
        state.secrecyAlert = 50; // 老細警戒值起步極高
        showEmote('👔', '老細 Mr. Chan 啤住你：「又遲到？今日盯實你！」');
        state.isLate = false;
      }
    };

    // 🚌 第一身車廂視覺與營業時間
    window.applyVehicleVisuals = function(type) {
      const container = document.getElementById('modal-commute-rush');
      const badge = document.getElementById('fp-commute-badge');
      if (!container || !badge) return;
      if (type === 'mtr') {
        badge.textContent = '🚇 港鐵車廂 · 沙甸魚視覺';
        container.style.backgroundColor = 'rgba(15, 23, 42, 0.95)';
      } else if (type === 'bus') {
        badge.textContent = '🚌 九巴上層 · 搖晃視覺';
        container.style.backgroundColor = 'rgba(69, 26, 3, 0.95)';
      } else if (type === 'redvan') {
        badge.textContent = '🚐 亡命紅 VAN · 推背視覺';
        container.style.backgroundColor = 'rgba(69, 10, 10, 0.95)';
      }
    };
    
    const originalSelectCommuteVehicle = window.selectCommuteVehicle || function(){};
    window.selectCommuteVehicle = function(type) {
      // 在此可加入 checkTransportAvailability() 的時間檢查邏輯
      applyVehicleVisuals(type);
      originalSelectCommuteVehicle(type);
    };

    // ✉️ 終局機制 (Endgame)
    window.executeResignationChoice = function(choice) {
      if (choice === 'quit') {
        closeModal('modal-resign');
        triggerSfx('bell'); 
        
        const repTitle = document.getElementById('report-title');
        const repSub = document.getElementById('report-subtitle');
        const repComment = document.getElementById('report-comment');
        
        if (repTitle) repTitle.textContent = '🎉 逃出生天：辭職成功！';
        if (repSub) repSub.textContent = `經歷咗 ${state.dayCount || 1} 日嘅折磨，你終於重獲自由！`;
        if (repComment) repComment.textContent = '你霸氣將辭職信掟喺老細枱面，轉身離開 IFC。從此解鎖「自由身/老闆模式」，中環再困你唔住！';
        
        const reportModal = document.getElementById('modal-report');
        if (reportModal) reportModal.classList.remove('hidden');
        
        state.employmentMode = 'freelance'; // 永久切換模式
      } else if (choice === 'counter') {
        state.money += 1500;
        closeModal('modal-resign');
        showEventBanner('💰', '接受 Counter-Offer', '老細加薪挽留，你選擇繼續留喺地獄...', '繼續返工', 'close');
      }
    };

    // 模擬遊戲時間推進
    setInterval(() => {
        // 每日 09:00 檢查宿醉
        if (state.clockMinutes === 540) window.checkHangover();
        
        // 每日 23:59 結算
        if (state.clockMinutes >= 1439) {
            window.endOfDayRoutine();
            state.clockMinutes = 540; // 重置為翌日 09:00
        }
    }, 60000);
// =========================================================================
    // 🌟 全新擴充機制：找卡數、宿醉、遲到、Endgame
    // =========================================================================
    
    // 1. 擴充全域狀態
    Object.assign(state, {
      day: 1,            // 星期一至五 (1=一, 5=五)
      dayCount: 1,       // 總生存日數
      kpiHistory: [],    // 記錄每週 KPI
      pipWarnings: 0,    // 警告信數量
      hangover: false,   // 宿醉狀態
      isLate: false      // 遲到狀態
    });

    // 2. 修復煙 Break Bug：轉場前強制熄煙
    function stopSmoking() {
      state.isSmoking = false;
      state.isLitCig = false;
      const buff = document.getElementById('hud-smoke-buff');
      if (buff) buff.classList.add('hidden');
      if (typeof previewModel !== 'undefined' && previewModel?.userData?.cigarette) {
          previewModel.userData.cigarette.visible = false;
      }
    }

    // 覆寫原本嘅 switchScene 來加入熄煙邏輯
    const originalSwitchScene = window.switchScene;
    window.switchScene = function(sceneId, bypass, callback) {
      stopSmoking(); 
      if(originalSwitchScene) originalSwitchScene(sceneId, bypass, callback);
    };

    // 3. 每日 23:59 結算：日期推進、找卡數與 Appraisal 季結算
    window.endOfDayRoutine = function() {
      state.kpiHistory.push(state.dailyKpi || 0);
      
      if (state.day === 5) {
        const rentAndBills = 3500;
        state.money -= rentAndBills;
        if (state.money < 0) {
          showEventBanner('💸', '破產警告！', '交唔出卡數同租金，今晚要瞓麥記，聽朝精神減半！', '慘烈接受', 'bankruptcy');
          state.sleepDebuff = 'homeless';
        } else {
          // 假設你有 addFeedLog 函數
          if(typeof addFeedLog === 'function') addFeedLog(`💸 星期五找卡數及交租，扣除 HK$${rentAndBills}`);
        }
        
        const avgKpi = state.kpiHistory.reduce((a, b) => a + b, 0) / 5;
        if (avgKpi >= 70) {
          if(typeof addFeedLog === 'function') addFeedLog('🎉 Appraisal 達標！升職加薪！');
          state.level += 1;
          state.money += 500; // 獎金
        } else if (avgKpi < 40) {
          state.pipWarnings += 1;
          showEventBanner('🚨', 'PIP 改善計劃警告！', '你呢個禮拜成日去煙Break同偷情，KPI太低！', '死死地氣簽名', 'pip');
          if (state.pipWarnings >= 2) {
             if(typeof addFeedLog === 'function') addFeedLog('💥 你被正式解僱！進入自由身模式！');
             state.employmentMode = 'freelance';
          }
        }
        
        state.kpiHistory = [];
        state.day = 1; // 循環回星期一
      } else {
        state.day += 1;
      }
      state.dayCount += 1;
      state.dailyKpi = 0; // 重置每日 KPI
    };

    // 4. 每日 09:00 檢查：宿醉系統
    window.checkHangover = function() {
      if (state.hangover) {
        state.caffeine = Math.max(0, state.caffeine - 30);
        document.getElementById('game-body').classList.add('animate-slap');
        setTimeout(() => document.getElementById('game-body').classList.remove('animate-slap'), 1000);
        showEventBanner('🤢', '嚴重宿醉', '尋晚蘭桂坊飲大咗，精神消耗速度加倍，快啲去買杯 $35 Starbucks 續命！', '頂硬上', 'close');
        state.hangover = false; // 提示後解除，但精神已扣減
      }
    };

    // 5. 迫地鐵連鎖反應 (遲到機制)
    // 覆寫原本的 commuteGameEnd
    window.commuteGameEnd = function(success) {
      if (!success) {
        state.isLate = true;
        if(typeof addFeedLog === 'function') addFeedLog('⏰ 上唔到車！你今日遲到咗 15 分鐘！');
      }
      window.switchScene('office');
      
      if (state.isLate) {
        state.secrecyAlert = 50; // 老細警戒值起步極高
        if(typeof showEmote === 'function') showEmote('👔', '老細 Mr. Chan 啤住你：「又遲到？今日盯實你！」');
        state.isLate = false;
      }
    };

    // 6. 交通工具視覺與營業時間
    window.applyVehicleVisuals = function(type) {
      const container = document.getElementById('modal-commute-rush');
      const badge = document.getElementById('fp-commute-badge');
      if (!container || !badge) return;
      if (type === 'mtr') {
        badge.textContent = '🚇 港鐵車廂 · 沙甸魚視覺';
        container.style.backgroundColor = 'rgba(15, 23, 42, 0.95)';
      } else if (type === 'bus') {
        badge.textContent = '🚌 九巴上層 · 搖晃視覺';
        container.style.backgroundColor = 'rgba(69, 26, 3, 0.95)';
      } else if (type === 'redvan') {
        badge.textContent = '🚐 亡命紅 VAN · 推背視覺';
        container.style.backgroundColor = 'rgba(69, 10, 10, 0.95)';
      }
    };
    
    const originalSelectCommuteVehicle = window.selectCommuteVehicle;
    window.selectCommuteVehicle = function(type) {
      applyVehicleVisuals(type);
      if(originalSelectCommuteVehicle) originalSelectCommuteVehicle(type);
    };

    // 7. 終局機制 (Endgame) 覆寫遞信邏輯
    window.executeResignationChoice = function(choice) {
      if (choice === 'quit') {
        closeModal('modal-resign');
        if(typeof triggerSfx === 'function') triggerSfx('bell'); 
        
        const repTitle = document.getElementById('report-title');
        const repSub = document.getElementById('report-subtitle');
        const repComment = document.getElementById('report-comment');
        
        if (repTitle) repTitle.textContent = '🎉 逃出生天：辭職成功！';
        if (repSub) repSub.textContent = `經歷咗 ${state.dayCount || 1} 日嘅折磨，你終於重獲自由！`;
        if (repComment) repComment.textContent = '你霸氣將辭職信掟喺老細枱面，轉身離開 IFC。從此解鎖「自由身/老闆模式」，中環再困你唔住！';
        
        const reportModal = document.getElementById('modal-report');
        if (reportModal) reportModal.classList.remove('hidden');
        
        state.employmentMode = 'freelance'; // 永久切換模式
      } else if (choice === 'counter') {
        state.money += 1500;
        closeModal('modal-resign');
        showEventBanner('💰', '接受 Counter-Offer', '老細加薪挽留，你選擇繼續留喺地獄...', '繼續返工', 'close');
      }
    };

    // 8. 綁定遊戲時間推進 (模擬時鐘)
    setInterval(() => {
        // 假設原本遊戲有 state.clockMinutes 負責記錄時間 (以分鐘計，540 = 09:00)
        if (state.clockMinutes === 540) window.checkHangover();
        
        if (state.clockMinutes >= 1439) { // 23:59
            window.endOfDayRoutine();
            state.clockMinutes = 540; // 重置為翌日 09:00
        }
    }, 60000); // 這裡設定現實 1 分鐘檢查一次，可依你遊戲的時鐘速度調整

  </script>
</body>
</html>
